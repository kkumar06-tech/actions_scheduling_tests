# Triggered by the external scheduler daily at 00:00 UTC (mirror of n09)
name: external_minutely_30
run-name: external_minutely_30 ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Unique ID set by the external scheduler
        required: false
        default: manual

permissions:
  contents: read

jobs:
  workload:
    uses: ./.github/workflows/workload_light.yml

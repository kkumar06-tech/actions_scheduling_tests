# Light workload: hashes random data for at least 40 seconds.
name: _light

on:
  workflow_call:

env:
  MIN_SECONDS: 40

jobs:
  light:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hash random data
        run: |
          end=$((SECONDS + MIN_SECONDS))
          while [ "$SECONDS" -lt "$end" ]; do
            head -c 50M /dev/urandom | sha256sum > /dev/null
          done